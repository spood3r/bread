name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci
      - name: Start server in background
        run: |
          node server.js &
          sleep 1
      - name: Check homepage
        run: curl -f http://localhost:3000
      - name: Check leaderboard API
        run: curl -sSf http://localhost:3000/api/leaderboard
